<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maiconteudo</title>
<meta name="description" content="Entra no olho. TikTok e YouTube do Maiconteudo.">
<meta name="theme-color" content="#07030F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Ideia: um olho de verdade, com personalidade de meme, num mundo psicodélico. */
:root{
  color-scheme:dark;
  --tinta:#FFF4E6;
  --nevoa:#D5CAEB;
  --luz:#FFD9A0;
  --ciano:#3DF0FF;
  --titulo:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07030F;color:var(--tinta);font-family:var(--texto);overflow:hidden}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#fundo{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

.cena{
  position:fixed;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));
}
#intro{gap:6px;text-align:center}
.caixa-olho{position:relative}
#olho{
  position:relative;display:block;width:min(100vw,640px);aspect-ratio:900/614;
  background:none;border:0;padding:0;cursor:pointer;
  transform-origin:50.5% 53%;
  transition:transform 1.15s cubic-bezier(.7,0,.84,0);
}
#olho canvas,#mini canvas{display:block;width:100%;height:100%}
body.zoom #olho{visibility:hidden}
#olho{will-change:transform}
#sussurro{margin:0;min-height:1.5em;font-size:19px;color:var(--nevoa);letter-spacing:.02em;padding:0 8px}
#dica{
  margin:0;font-family:var(--titulo);font-weight:800;font-size:30px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--luz);opacity:0;transition:opacity .6s;
}
#dica small{display:block;font-family:var(--texto);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:none;color:var(--nevoa)}
#dica.ver{opacity:1;animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.55}}
#pular{
  position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:5;
  min-height:44px;padding:10px 18px;border:0;border-radius:999px;
  background:#FFFFFF14;color:var(--nevoa);font:600 15px var(--texto);cursor:pointer;
}
body.mergulho #sussurro,body.mergulho #dica,body.mergulho #pular{opacity:0;transition:opacity .2s;animation:none}
body.dentro #intro,body.dentro #pular{display:none}

/* Balão de fala do olho */
.balao{
  position:absolute;z-index:3;pointer-events:none;
  padding:10px 16px;border-radius:20px;
  background:#FFF8EC;color:#1A0B24;
  font:800 20px/1.15 var(--texto);white-space:nowrap;
  box-shadow:4px 4px 0 #FF3D9A,-3px -3px 0 #3DF0FF;
  opacity:0;transform:scale(.4) rotate(-8deg);
}
.balao::after{
  content:"";position:absolute;width:18px;height:18px;background:#FFF8EC;
  transform:rotate(45deg);
}
.balao.ver{animation:salta .5s cubic-bezier(.2,1.6,.4,1) forwards}
.balao.sai{animation:sumir .25s ease-in forwards}
@keyframes salta{to{opacity:1;transform:scale(1) rotate(var(--r,-4deg))}}
@keyframes sumir{from{opacity:1;transform:scale(1) rotate(var(--r,-4deg))}to{opacity:0;transform:scale(.6) rotate(6deg)}}
#balao{right:3%;top:-4%;--r:-5deg}
#balao::after{left:30px;bottom:-7px}
#balaoMini{left:-8%;bottom:88%;font-size:16px;padding:8px 13px;--r:3deg;max-width:min(78vw,300px);white-space:normal;text-align:center}
#balaoMini::after{left:18px;bottom:-7px}

#flash{position:fixed;inset:0;z-index:4;background:#FFF6EC;opacity:0;pointer-events:none}
#flash.estoura{animation:estoura .7s ease-out}
@keyframes estoura{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}

/* Do lado de dentro */
#links{gap:18px;overflow-y:auto;opacity:0;visibility:hidden;-webkit-user-select:text;user-select:text}
body.dentro #links{opacity:1;visibility:visible;transition:opacity .4s}
#mini{display:block;width:180px;aspect-ratio:900/614;background:none;border:0;padding:0;cursor:pointer;margin:-14px 0 -18px}
h1{margin:0;font-family:var(--titulo);font-weight:800;line-height:.9;white-space:nowrap;font-size:72px;letter-spacing:.01em}
h1 .l{
  display:inline-block;opacity:0;transform:translateY(-70px) scale(1.7);
  color:hsl(var(--h) 100% 66%);
  text-shadow:-2px 0 #3DF0FFAA,2px 0 #FF3D9AAA,0 0 26px hsl(var(--h) 100% 60% / .55);
}
body.dentro h1 .l{animation:cai .6s cubic-bezier(.2,1.5,.4,1) forwards,onda 3.2s ease-in-out infinite;animation-delay:calc(var(--i) * 60ms + .2s),calc(var(--i) * 110ms + 1.4s)}
@keyframes cai{to{opacity:1;transform:none}}
@keyframes onda{0%,100%{transform:none}50%{transform:translateY(-5px)}}
h1.glitch{animation:glitch .22s steps(2) 1}
@keyframes glitch{
  0%{transform:translateX(0);filter:none}
  33%{transform:translateX(-5px) skewX(-10deg);filter:hue-rotate(110deg)}
  66%{transform:translateX(4px) skewX(6deg);filter:hue-rotate(-80deg)}
  100%{transform:none;filter:none}
}
.bio{margin:0;text-align:center;font-size:19px;line-height:1.4}
.bio small{display:block;margin-top:4px;font-size:16px;color:var(--nevoa)}
.subir{opacity:0;transform:translateY(18px)}
body.dentro .subir{animation:sobe .6s ease-out forwards;animation-delay:var(--d)}
@keyframes sobe{to{opacity:1;transform:none}}

.canais{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.canal{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;align-items:center;gap:14px;
  min-height:82px;padding:14px 16px 14px 14px;border-radius:22px;
  color:var(--tinta);text-decoration:none;
  box-shadow:0 18px 34px -16px var(--b);
  transition:transform .12s;
}
.canal::before{
  content:"";position:absolute;inset:-80%;z-index:-2;
  background:conic-gradient(from 0deg,var(--a),var(--b),#FFFFFF,var(--a));
  animation:gira 3.6s linear infinite;
}
.canal::after{
  content:"";position:absolute;inset:2px;z-index:-1;border-radius:20px;
  background:linear-gradient(180deg,#1D1133 0%,#0F081C 100%);
}
@keyframes gira{to{transform:rotate(1turn)}}
.canal:active{transform:scale(.97)}
.selo{
  flex:none;width:56px;height:56px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--a),var(--b));color:#12081F;
  box-shadow:0 1px 0 #FFFFFF66 inset,0 6px 14px -6px var(--b);
}
.selo svg{width:30px;height:30px;display:block}
.tiktok .selo{background:#05050A;box-shadow:0 0 0 1px #FFFFFF22 inset,0 6px 16px -6px #FF3D9A}
.youtube .selo{background:#FFFFFF;box-shadow:0 0 0 1px #FFFFFF55 inset,0 6px 16px -6px #FF2D2D}
#segredos{
  position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:5;
  padding:7px 13px;border-radius:999px;background:#0E0719D9;
  box-shadow:0 0 0 1px #FFFFFF22 inset,0 6px 18px -8px #000;
  font:700 14px/1.2 var(--texto);color:var(--nevoa);
  opacity:0;visibility:hidden;transition:opacity .5s,transform .3s;pointer-events:none;
}
body.dentro #segredos{opacity:1;visibility:visible}
#segredos b{color:var(--luz)}
#segredos.pulo{transform:scale(1.15)}
#segredos.zerou{color:#12081F;background:linear-gradient(90deg,#FFD23D,#FF3D9A,#3DF0FF)}
.rotulo{flex:1;min-width:0}
.nome{display:block;font-family:var(--titulo);font-weight:800;font-size:33px;line-height:1}
.arroba{display:block;margin-top:3px;font-size:15px;color:var(--nevoa)}
.ir{
  flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:#FFFFFF14;box-shadow:0 0 0 1px #FFFFFF24 inset;
}
.ir svg{width:16px;height:16px;display:block}
.tiktok{--a:#3DF0FF;--b:#FF3D9A}
.youtube{--a:#FFD23D;--b:#FF3D3D}

footer{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:var(--nevoa);letter-spacing:.04em}
#denovo{min-height:44px;padding:8px 14px;border:0;background:none;color:var(--nevoa);font:600 15px var(--texto);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--ciano);outline-offset:4px;border-radius:12px}

@media (prefers-reduced-motion:reduce){
  #olho,.canal{transition:none}
  .canal::before{animation:none}
  h1 .l,.subir{opacity:1;transform:none}
  body.dentro h1 .l,body.dentro .subir{animation:none}
}
</style>
</head>

<canvas id="fundo" aria-hidden="true"></canvas>

  <p id="sussurro" aria-live="polite"></p>
  <div class="caixa-olho">

    <div class="balao" id="balao" aria-live="polite"></div>

  <p id="dica" aria-hidden="true">toque no olho<small>(ele não morde... eu acho)</small></p>

  /* ================= Sons de desenho animado ================= */

  /* ================= Cenas ================= */
  var grande = criarOlho(document.querySelector('#olho canvas'));
  var mini = criarOlho(document.querySelector('#mini canvas'));
  var balao = document.getElementById('balao'), balaoMini = document.getElementById('balaoMini');
  var sussurro = document.getElementById('sussurro'), dica = document.getElementById('dica'), flash = document.getElementById('flash');
  var timers = [], proxReacao = 0;

  function saudacao() {
    var h = new Date().getHours();

  }
  function digitar(txt, cb) {
